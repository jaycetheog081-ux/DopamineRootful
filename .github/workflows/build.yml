name: Build Nova Pulse

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Verify Project and Scheme
        run: |
          set -euo pipefail
          test -d "Amethyst/Amethyst.xcodeproj"
          xcodebuild -list -project "Amethyst/Amethyst.xcodeproj"

      - name: Build Application
        run: |
          set -euo pipefail

          xcodebuild clean build \
            -project "Amethyst/Amethyst.xcodeproj" \
            -scheme "Amethyst" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build"

      - name: Package IPA
        run: |
          set -euo pipefail

          APP_PATH="$(find "$PWD/build" -maxdepth 2 -type d -name "*.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle was produced"
            find "$PWD/build" -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf Payload NovaPulse.ipa
          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NovaPulse.ipa

          test -s NovaPulse.ipa
          ls -lh NovaPulse.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaPulse-Unsigned-IPA
          path: NovaPulse.ipa
          if-no-files-found: error
          retention-days: 5
